frame:
  dataset_name: examples
  dataset_item: PWC_immersion_notch_stainless_steel.mat
  instrument_delay: 400.e-9 # shift the t=0 defined in datafile by this number.
  
probe:
  frequency: 5.0e+6
  numx: 40
  pitch_x: 0.3e-3
  numy: 1
  pitch_y: .nan
  dimensions: [0.2e-3, 15.e-3, .nan]

toneburst:
  num_cycles: 4
  
probe_location:
  # Element corresponding to x=0:
  ref_element: mean

couplant_material:
  metadata:
    long_name: Water
    source: "Krautkrämer 1990"
  longitudinal_vel: 1469.
  density: 1000.
  state_of_matter: liquid

block_material:
  metadata:
    long_name: Stainless steel
    source: R.Pyle EngD Thesis
  longitudinal_vel: 5735.
  transverse_vel: 3152.
  density: 2700.

scatterer:
    angle_deg: 90.
    location:
    x: -21.0e-3
    y: 0.0
    z: 30.0e-3
    specs:
         kind: crack_tip
         crack_length: 1e-3
  

array_fname: 'Imasonic 1D 64els 5.00MHz 0.63mm pitch'
  